# Phoenix full stack: Postgres + Kafka + backend + consumer + frontend.
#
# One command from the repo root:
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Then open http://localhost:5173 and log in with the seeded
# admin (override via PHOENIX_ADMIN_* env, see README).
#
# Notes:
# - ./backend/storage is mounted so the trained model, settings,
#   and IEEE raw data carry over from local runs.
# - Postgres here is a FRESH database (phoenix_postgres_data
#   volume), separate from any local Windows Postgres service.
#   On first start, seed the admin:
#     docker compose -f docker/docker-compose.yml exec backend \
#       python seed_admin.py
# - The kafka-only compose (docker-compose.kafka.yml) is kept
#   for the manual local-dev flow documented in the README.

services:
  postgres:
    image: postgres:16
    container_name: phoenix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phoenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoenix-dev-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-phoenix_db}
    volumes:
      - phoenix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: phoenix-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: phoenix-kafka-cluster-01
    volumes:
      - phoenix-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: phoenix-backend
    ports:
      - "1992:1992"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-phoenix}:${POSTGRES_PASSWORD:-phoenix-dev-change-me}@postgres:5432/${POSTGRES_DB:-phoenix_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: phoenix-transactions
      KAFKA_GROUP_ID: phoenix-scoring-group
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PHOENIX_ADMIN_EMAIL: ${PHOENIX_ADMIN_EMAIL:-}
      PHOENIX_ADMIN_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:-}
    volumes:
      - ../backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1992/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  consumer:
    build: ../backend
    container_name: phoenix-consumer
    command: ["python", "kafka_consumer.py"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-phoenix}:${POSTGRES_PASSWORD:-phoenix-dev-change-me}@postgres:5432/${POSTGRES_DB:-phoenix_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: phoenix-transactions
      KAFKA_GROUP_ID: phoenix-scoring-group
    volumes:
      - ../backend/storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:1992}
    container_name: phoenix-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  phoenix-postgres-data:
  phoenix-kafka-data:
