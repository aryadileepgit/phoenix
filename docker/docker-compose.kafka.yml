# Phoenix Kafka broker (single-node KRaft, no ZooKeeper).
#
# Start:  docker compose -f docker/docker-compose.kafka.yml up -d
# Stop:   docker compose -f docker/docker-compose.kafka.yml down
#
# The `phoenix-transactions` topic is auto-created on first
# publish (auto.create.topics.enable=true is the broker
# default). To create it explicitly:
#   docker exec phoenix-kafka /opt/kafka/bin/kafka-topics.sh \
#     --create --topic phoenix-transactions \
#     --bootstrap-server localhost:9092

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: phoenix-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: phoenix-kafka-cluster-01
    volumes:
      - phoenix-kafka-data:/var/lib/kafka/data

volumes:
  phoenix-kafka-data:
